<section class="todo-list">
  <header>
    <h1>To-do List</h1>
  </header>
  <div class="content">
    <div class="task-form container">
      <app-task-form (newTaskCreated)="addTaskToList($event)"/>
    </div>
    <div class="task-list container">
      <app-task-list [taskList]="taskList()" />
    </div>
  </div>
</section>
